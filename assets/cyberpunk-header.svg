<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Shorya — Build, Experiment, Evolve</title>
  <desc id="desc">Animated cyberpunk-inspired banner with an abstract holographic core, orbiting rings, stars, and neon cyan and violet gradients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B17"/><stop offset=".52" stop-color="#101832"/><stop offset="1" stop-color="#190E2E"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42E8FF"/><stop offset=".52" stop-color="#8A7CFF"/><stop offset="1" stop-color="#FF58D6"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#67F4FF" stop-opacity=".8"/><stop offset=".35" stop-color="#5F8CFF" stop-opacity=".25"/><stop offset="1" stop-color="#5F8CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#89B8FF" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <g fill="#BEEBFF" opacity=".68">
    <circle cx="78" cy="82" r="1.4"/><circle cx="260" cy="332" r="1.2"/><circle cx="408" cy="60" r="1.5"/><circle cx="770" cy="88" r="1.2"/><circle cx="1085" cy="88" r="1.4"/><circle cx="1120" cy="300" r="1.2"/><circle cx="920" cy="360" r="1.4"/>
  </g>
  <circle cx="900" cy="205" r="190" fill="url(#orb)"/>
  <g transform="translate(900 205)" fill="none" stroke="url(#neon)" filter="url(#glow)">
    <ellipse rx="152" ry="58" stroke-width="2.2" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="152" ry="58" stroke-width="1.8" opacity=".65" transform="rotate(60)">
      <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="-360" dur="34s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="152" ry="58" stroke-width="1.5" opacity=".55" transform="rotate(120)">
      <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
    </ellipse>
    <path d="M0-82 72-42 72 42 0 82-72 42-72-42Z" stroke-width="2.4" fill="#16294A" fill-opacity=".72"/>
    <path d="M0-82 0 0 72 42M0 0-72 42M0 0 0 82" stroke-width="1.4" opacity=".8"/>
    <circle r="17" fill="#61EFFF" fill-opacity=".9" stroke="white" stroke-width="1.3"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="76" y="94" fill="#74EFFF" font-size="17" letter-spacing="5" font-weight="600">PORTFOLIO / AI • SOFTWARE • RESEARCH</text>
    <text x="72" y="190" fill="#F4F7FF" font-size="58" font-weight="750" letter-spacing="-1">SHORYA PRATAP</text>
    <text x="76" y="246" fill="url(#neon)" font-size="38" font-weight="700" letter-spacing="2">BUILD. EXPERIMENT. EVOLVE.</text>
    <text x="78" y="300" fill="#B7C7E8" font-size="20">Computer Engineering · AI/ML · Full-stack · Quantum Computing</text>
    <g transform="translate(78 345)" font-size="13" font-weight="600" letter-spacing="2">
      <rect width="112" height="34" rx="17" fill="#132A44" stroke="#44DFFF" stroke-opacity=".8"/><text x="56" y="22" fill="#9EEFFF" text-anchor="middle">ENGINEER</text>
      <rect x="126" width="124" height="34" rx="17" fill="#1A2046" stroke="#9C8BFF" stroke-opacity=".8"/><text x="188" y="22" fill="#C8BFFF" text-anchor="middle">CREATOR</text>
      <rect x="264" width="122" height="34" rx="17" fill="#321A43" stroke="#FF67D8" stroke-opacity=".8"/><text x="325" y="22" fill="#FFC0EC" text-anchor="middle">EXPLORER</text>
    </g>
  </g>
  <path d="M36 28H1164V392H36Z" fill="none" stroke="url(#neon)" stroke-opacity=".42" stroke-width="1.2" rx="24"/>
</svg>